<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人介紹與活動報名</title>
  <style>
    /* 全域設定與主題色彩 */
    :root {
      --bg-mint: #e2f5ee;       /* 淺薄荷綠背景 */
      --primary-color: #be0016; /* 酒紅色主題 */
      --accent-color: #e8c9ff;  /* 搭配淺粉紫 */
      --card-bg: #ffffff;       /* 卡片白色背景 */
      --text-main: #2b2b2b;
      --text-muted: #555555;
      --disabled-bg: #888888;   /* 停用灰色 */
      --error-color: #d32f2f;   /* 錯誤提示紅字 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* 全域字型指定為 FangSong (仿宋體) */
    body {
      font-family: "FangSong", "仿宋", "STFangsong", "Songti TC", serif;
      background-color: var(--bg-mint);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    /* 語意化結構：Header & Nav */
    header {
      background-color: var(--primary-color);
      color: #ffffff;
      padding: 1.2rem 2rem;
      box-shadow: 0 4px 12px rgba(190, 0, 22, 0.15);
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    nav {
      margin-top: 0.6rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav a {
      color: var(--accent-color);
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* 語意化結構：Main 主內容區 (Flexbox 橫向排列、置中、16px 間距) */
    main {
      flex: 1;
      display: flex;
      flex-direction: row;        /* 預設橫向排成一列 */
      justify-content: center;    /* 水平置中對齊 */
      align-items: stretch;       /* 等高排列 */
      gap: 16px;                  /* 卡片間距留 16px */
      padding: 3rem 1.5rem;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }

    /* 卡片通用設計 */
    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 2.2rem;
      flex: 1;
      box-shadow: 0 10px 25px rgba(190, 0, 22, 0.08);
      border: 1px solid rgba(190, 0, 22, 0.12);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(190, 0, 22, 0.12);
    }

    /* 左側：個人介紹卡片 */
    .profile-card {
      align-items: center;
      text-align: center;
    }

    /* 酒紅色佔位圓形頭貼 */
    .avatar-wrapper {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background-color: var(--primary-color);
      border: 4px solid var(--accent-color);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 14px rgba(190, 0, 22, 0.25);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name {
      font-size: 1.45rem;
      color: var(--primary-color);
      margin-bottom: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .profile-bio {
      font-size: 1.05rem;
      color: #3d2338;
      background-color: var(--accent-color);
      padding: 1.2rem;
      border-radius: 12px;
      margin-top: auto;
      width: 100%;
      font-weight: 600;
    }

    /* 右側：活動報名表單卡片 */
    .form-card h2 {
      font-size: 1.45rem;
      color: var(--primary-color);
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      text-align: left;
    }

    label {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .required {
      color: var(--primary-color);
      margin-left: 2px;
      font-weight: bold;
    }

    input, select {
      font-family: inherit; /* 繼承 FangSong 仿宋體 */
      padding: 0.75rem 1rem;
      border: 1.5px solid #d9d9d9;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      background-color: #fafafa;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary-color);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(190, 0, 22, 0.15);
    }

    /* Email 驗證錯誤時的輸入框樣式 */
    input.input-error {
      border-color: var(--error-color) !important;
      background-color: #fff9f9;
      box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.15) !important;
    }

    /* 錯誤訊息紅字提示 */
    .error-message {
      color: var(--error-color);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;             /* 預設隱藏 */
      margin-top: 0.2rem;
    }

    /* 送出按鈕樣式 */
    .btn-submit {
      font-family: inherit;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 0.5rem;
      letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    /* 按鈕點擊後停用樣式 (轉灰、禁止點擊) */
    .btn-submit:disabled {
      background-color: var(--disabled-bg);
      color: #eaeaea;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 語意化結構：Footer */
    footer {
      background-color: #242424;
      color: #d1d1d1;
      text-align: center;
      padding: 1.5rem;
      font-size: 0.95rem;
      margin-top: auto;
      letter-spacing: 1px;
    }

    /* Media Query：小於 768px 改為直向堆疊 */
    @media (max-width: 768px) {
      main {
        flex-direction: column;
        align-items: center;
        padding: 1.5rem 1rem;
      }

      .card {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- 1. Header 與 Nav 區塊 -->
  <header>
    <h1>個人專題頁面</h1>
    <nav>
      <ul>
        <li><a href="#about">關於我</a></li>
        <li><a href="#register">活動報名</a></li>
      </ul>
    </nav>
  </header>

  <!-- 2. Main 主內容區塊 -->
  <main>
    <!-- 左側：個人介紹 -->
    <article id="about" class="card profile-card">
      <div class="avatar-wrapper">
        <img src="avatar.png" alt="個人頭貼" onerror="this.style.display='none'">
      </div>
      <h2 class="profile-name">3b432056 張鳳麟</h2>
      <p class="profile-bio">能不出門就不出門 能不吃飯就不吃飯 懶得要死的大學生</p>
    </article>

    <!-- 右側：活動報名表單 -->
    <section id="register" class="card form-card">
      <h2>活動報名表單</h2>
      <form id="signup-form" novalidate>
        <!-- 姓名欄位 (必填) -->
        <div class="form-group">
          <label for="user-name">姓名 <span class="required">*</span></label>
          <input type="text" id="user-name" name="userName" placeholder="請輸入姓名" required>
        </div>

        <!-- Email 欄位 (必填，含即時紅字錯誤提示) -->
        <div class="form-group">
          <label for="user-email">Email <span class="required">*</span></label>
          <input type="email" id="user-email" name="userEmail" placeholder="example@mail.com" required>
          <span id="email-error" class="error-message">請輸入有效的電子郵件格式（例如：user@example.com）</span>
        </div>

        <!-- 場次欄位 (下拉選單) -->
        <div class="form-group">
          <label for="event-session">報名場次</label>
          <select id="event-session" name="eventSession">
            <option value="session-1">第一場：前端設計入門與 AI 應用</option>
            <option value="session-2">第二場：Flexbox 快速排版心法</option>
            <option value="session-3">第三場：互動式網頁實作工作坊</option>
          </select>
        </div>

        <!-- 送出按鈕 -->
        <button type="submit" id="submit-btn" class="btn-submit">送出報名</button>
      </form>
    </section>
  </main>

  <!-- 3. Footer 頁尾區塊 -->
  <footer>
    <p>&copy; 2026 張鳳麟. 互動式網頁設計課程作業.</p>
  </footer>

  <!-- 4. JavaScript 即時驗證與互動邏輯 -->
  <script>
    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');
    const emailInput = document.getElementById('user-email');
    const emailError = document.getElementById('email-error');
    const nameInput = document.getElementById('user-name');

    // 電子郵件格式正規表達式
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // 即時驗證 Email 函式
    function validateEmail() {
      const emailValue = emailInput.value.trim();

      // 如果欄位是空的，先不提示格式錯誤（點送出時由必填邏輯檢查）
      if (emailValue === '') {
        emailError.style.display = 'none';
        emailInput.classList.remove('input-error');
        return false;
      }

      // 檢查格式是否符合正規表達式
      if (!emailRegex.test(emailValue)) {
        // 格式錯誤：立即彈出紅字提示並改變輸入框外框
        emailError.style.display = 'block';
        emailInput.classList.add('input-error');
        return false;
      } else {
        // 格式正確：紅字提示立刻消失
        emailError.style.display = 'none';
        emailInput.classList.remove('input-error');
        return true;
      }
    }

    // 監聽 input 事件：使用者每鍵入或刪除一個字元時即時驗證
    emailInput.addEventListener('input', validateEmail);

    // 表單送出事件監聽
    form.addEventListener('submit', function(event) {
      event.preventDefault(); // 阻止預設跳頁

      const isEmailValid = validateEmail();

      // 檢查姓名必填
      if (nameInput.value.trim() === '') {
        alert('請填寫姓名！');
        nameInput.focus();
        return;
      }

      // 檢查 Email 必填與格式
      if (emailInput.value.trim() === '' || !isEmailValid) {
        emailError.style.display = 'block';
        emailInput.classList.add('input-error');
        emailInput.focus();
        return;
      }

      // 驗證全數通過後：
      // 1. 將按鈕文字修改為「已送出」
      submitBtn.textContent = '已送出';

      // 2. 停用按鈕（觸發 CSS :disabled 轉灰且無法再點）
      submitBtn.disabled = true;

      // 3. 提示成功
      alert('報名表單已成功送出！');
    });
  </script>

</body>
</html>
